# Home Assistant add-on manifest. The repository root is the add-on directory so
# the Docker build can see both packages/api and packages/web.
name: Notionish
version: "0.1.1"
slug: notionish
description: Block-based notes and docs, inside Home Assistant
url: https://github.com/Mila5847/Notionish
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:notebook-outline
panel_title: Notionish
# Non-admin Home Assistant users can open Notionish too.
panel_admin: false
services:
  - mysql:need
options:
  database_name: notionish
schema:
  database_name: str
  database_url: str?
  unsplash_access_key: password?
